services:
  redis-a:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-b:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  asynqmon:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Compose reads .env in this folder for ${...} substitution.
      # Example: ASYNQMON_REDIS_CONNECTIONS={"redis-a":"redis-a:6379","redis-b":"redis-b:6379"}
      ASYNQMON_REDIS_CONNECTIONS: ${ASYNQMON_REDIS_CONNECTIONS:-redis-a=redis-a:6379,redis-b=redis-b:6379}
      PORT: ${PORT:-8080}
    depends_on:
      - redis-a
      - redis-b
